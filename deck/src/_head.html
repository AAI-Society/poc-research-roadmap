<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proof-of-Control Research Agenda</title>
<meta name="description" content="Advanced AI Society — the Proof-of-Control research agenda: problems, solutions, traction, roadmap and asks. September 2026.">
<style>
/*FONTS*/
:root{
  --aais-black:#0A0A0A; --aais-off-white:#F0EDEA; --aais-neon:#CFFF04; --aais-cinnabar:#C0431B;
  --surface-2:#E8E5E0; --ink-2:#3a382f; --ink-3:#6B6862; --ink-4:#5A5751;
  --hair:rgba(10,10,10,.16); --hair-10:rgba(10,10,10,.10); --black-60:rgba(10,10,10,.60); --black-30:rgba(10,10,10,.30); --black-10:rgba(10,10,10,.10);
  --series-1:#324292; --series-2:#0E3A08;
  --font-display:"Jost","Futura","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --font-text:"Atkinson Hyperlegible Next","Helvetica Neue",Arial,sans-serif;
  --font-sans:"Inter","Montserrat","Helvetica Neue",Arial,sans-serif;
  --font-code:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
html,body{height:100%;margin:0}
body{background:#3a3a3a;color:var(--aais-black);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(1);transform-origin:center center;background:var(--aais-off-white)}
.s{position:absolute;inset:0;width:1920px;height:1080px;box-sizing:border-box;background:var(--aais-off-white);color:var(--aais-black);overflow:hidden;padding:128px 150px 118px;display:none;flex-direction:column;justify-content:flex-start;font-family:var(--font-sans)}
.s.on{display:flex}
.s.center{justify-content:center}
.s.tight{padding-top:96px}
@media (prefers-reduced-motion:no-preference){
  .s.on{animation:arrive 300ms cubic-bezier(.22,1,.36,1) both}
  @keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
.eyebrow{font-family:var(--font-sans);font-size:18px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 34px}
.title{font-family:var(--font-display);font-weight:500;font-size:52px;line-height:1.09;letter-spacing:-.01em;margin:0 0 20px;max-width:28ch;text-wrap:balance}
.lede{font-family:var(--font-text);font-size:26px;line-height:1.45;color:var(--ink-2);margin:0 0 44px;max-width:54ch}
.poc{font-weight:600}
.mark{background:var(--aais-neon);color:var(--aais-black);font-weight:600;padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
code{font-family:var(--font-code);font-size:.92em}
.foot{position:absolute;bottom:44px;left:150px;right:150px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.foot .n{font-family:var(--font-sans);font-size:14px;letter-spacing:.06em;color:var(--ink-3)}
.lockup{width:180px;height:auto;display:block;aspect-ratio:1082.6/64.59}
.src{font-family:var(--font-sans);font-size:17px;letter-spacing:.04em;color:var(--ink-3);margin:32px 0 0;max-width:110ch}
.src b{font-weight:500;color:var(--aais-black)}
.divider .obj{position:absolute;inset:0;color:var(--aais-cinnabar);pointer-events:none}
.divider .obj svg{width:100%;height:100%;display:block}
.divider .col{position:absolute;left:150px;top:120px;right:150px;z-index:2}
.divider .sec{font-family:var(--font-sans);font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 16px}
.divider .ord{font-family:var(--font-display);font-weight:600;font-size:340px;line-height:.78;letter-spacing:-.05em;margin:0}
.divider h2{font-family:var(--font-display);font-weight:600;font-size:75px;line-height:1.04;letter-spacing:-.02em;margin:28px 0 0;max-width:12ch}
.divider .stand{font-family:var(--font-text);font-size:26px;line-height:1.35;margin:22px 0 0;max-width:39ch;color:var(--ink-2)}
.statement{font-family:var(--font-display);font-weight:500;font-size:112px;line-height:1.06;letter-spacing:-.02em;margin:0;max-width:18ch;text-wrap:balance}
.support{font-family:var(--font-text);font-size:34px;line-height:1.45;margin:56px 0 0;max-width:44ch;color:var(--ink-2)}
/* metric grid */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:0 56px;border-top:2px solid var(--aais-black)}
.metrics>div{padding:40px 0 34px;border-bottom:1px solid var(--hair)}
.metrics .v{font-family:var(--font-display);font-weight:500;font-size:110px;line-height:.92;letter-spacing:-.02em}
.metrics .l{font-family:var(--font-sans);font-size:20px;font-weight:500;color:var(--ink-3);margin-top:14px;max-width:22ch;line-height:1.3}
/* three columns */
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:56px}
.cols3 .bar{height:20px;background:var(--aais-black)}
.cols3 .bar.accent{background:var(--aais-cinnabar)}
.cols3 .k{font-family:var(--font-sans);font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);margin:28px 0 0}
.cols3 h3{font-family:var(--font-display);font-weight:500;font-size:40px;line-height:1.1;margin:14px 0 0;letter-spacing:-.01em}
.cols3 p{font-family:var(--font-text);font-size:23px;line-height:1.5;margin:24px 0 0;color:var(--aais-black)}
.cols3 .q{font-family:var(--font-text);font-size:21px;line-height:1.45;margin:22px 0 0;color:var(--ink-2);border-top:1px solid var(--hair);padding-top:18px}
/* tables */
table.t{width:100%;border-collapse:collapse;table-layout:fixed}
table.t th{font-family:var(--font-sans);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);text-align:left;padding:0 24px 14px 0;border-bottom:2px solid var(--aais-black);font-weight:600}
table.t td{font-family:var(--font-text);font-size:21px;line-height:1.35;vertical-align:top;padding:18px 24px 18px 0;border-bottom:1px solid var(--hair)}
table.t td.name{font-family:var(--font-sans);font-weight:600;font-size:21px}
table.t td.det{font-family:var(--font-sans);font-weight:600;font-size:21px}
table.t td.muted{color:var(--ink-2)}
table.t tr:last-child td{border-bottom:2px solid var(--aais-black)}
table.t.compact td{padding:11px 24px 11px 0;font-size:19px}
table.t.compact td.det{font-size:19px}
/* list instrument */
.list{border-top:2px solid var(--aais-black)}
.list .row{display:grid;grid-template-columns:64px 560px 1fr;gap:0 36px;align-items:baseline;padding:22px 0;border-bottom:1px solid var(--hair)}
.list .row .i{font-family:var(--font-sans);font-size:22px;color:var(--ink-3)}
.list .row .h{font-family:var(--font-display);font-size:36px;line-height:1.12;letter-spacing:-.01em}
.list .row .d{font-family:var(--font-text);font-size:23px;line-height:1.45;color:var(--ink-2)}
/* bar chart */
.bars{display:flex;align-items:flex-end;gap:40px;height:330px;border-bottom:2px solid var(--aais-black)}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bars .v{font-family:var(--font-display);font-weight:500;font-size:40px;line-height:1;margin-bottom:14px}
.bars .b{width:100%;background:var(--aais-black)}
.bars .b.accent{background:var(--aais-cinnabar)}
.barlab{display:flex;gap:40px;margin-top:18px}
.barlab>div{flex:1;text-align:center;font-family:var(--font-sans);font-size:20px;font-weight:600;line-height:1.25}
.barlab>div span{display:block;font-weight:400;color:var(--ink-3);font-size:17px;margin-top:8px;letter-spacing:.02em}
/* coverage grid */
.cov{display:grid;grid-template-columns:1fr 1fr;gap:0 80px}
.cov .hd,.cov .r{display:grid;grid-template-columns:44px 1fr 150px 150px;align-items:center}
.cov .hd{font-family:var(--font-sans);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);font-weight:600;padding-bottom:12px;border-bottom:2px solid var(--aais-black)}
.cov .r{height:44px;border-bottom:1px solid var(--hair)}
.cov .r .i{font-family:var(--font-sans);font-size:17px;color:var(--ink-3)}
.cov .r .f{font-family:var(--font-code);font-size:21px}
.cov .r .c{display:flex;align-items:center;justify-content:flex-start;gap:12px;font-family:var(--font-sans);font-size:14px;letter-spacing:.06em;color:var(--ink-3)}
.sq{width:18px;height:18px;display:inline-block;box-sizing:border-box}
.sq.full{background:var(--aais-black)}
.sq.half{border:2px solid var(--aais-black);background:transparent}
.sq.none{border:1px solid rgba(10,10,10,.22);background:transparent}
.sq.accent{background:var(--aais-cinnabar)}
.legend{display:flex;gap:40px;align-items:center;font-family:var(--font-sans);font-size:17px;color:var(--ink-2);margin-top:28px}
.legend span{display:inline-flex;gap:12px;align-items:center}
/* split slide */
.split{padding:0}
.split .l{position:absolute;left:0;top:0;bottom:0;width:50%;padding:128px 80px 118px 150px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}
.split .r{position:absolute;right:0;top:0;bottom:0;width:50%;background:var(--surface-2);padding:216px 150px 118px 96px;box-sizing:border-box}
.split .r h3{font-family:var(--font-display);font-weight:500;font-size:34px;line-height:1.15;margin:0 0 16px;letter-spacing:-.01em}
.split .r p{font-family:var(--font-text);font-size:22px;line-height:1.5;color:var(--ink-2);margin:0 0 44px;max-width:44ch}
/* timeline bands */
.bands{display:flex;flex-direction:column;max-width:1620px}
.band{display:grid;grid-template-columns:96px 340px 1fr;gap:0 40px;align-items:start;padding:18px 0;border-top:2px solid var(--aais-black)}
.band:first-child{border-top:0}
.band .o{font-family:var(--font-display);font-weight:500;font-size:48px;line-height:.9;color:rgba(10,10,10,.28);margin:0}
.band .ph{font-family:var(--font-display);font-weight:500;font-size:30px;line-height:1.14;letter-spacing:-.01em;margin:0}
.band .pp{font-family:var(--font-sans);font-size:18px;letter-spacing:.08em;color:var(--ink-3);margin:8px 0 0}
.band .what{font-family:var(--font-display);font-weight:500;font-size:25px;line-height:1.18;letter-spacing:-.01em;margin:0;max-width:52ch}
.band .why{font-family:var(--font-text);font-size:18px;line-height:1.4;color:var(--ink-2);margin:6px 0 0;max-width:66ch}
/* stats trio */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:56px;border-top:2px solid var(--aais-black);padding-top:48px}
.trio .v{font-family:var(--font-display);font-weight:500;font-size:150px;line-height:.9;letter-spacing:-.02em}
.trio .l{font-family:var(--font-sans);font-size:21px;font-weight:500;color:var(--ink-3);margin-top:18px;max-width:22ch;line-height:1.35}
.trio .l b{color:var(--aais-black);font-weight:600}
/* HUD */
.hud{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:50;font-family:var(--font-sans);font-size:12px;letter-spacing:.06em;color:rgba(240,237,234,.6);padding:10px 0;opacity:0;transition:opacity 300ms}
body.showhud .hud{opacity:1}
@media print{
  body{background:#F0EDEA;overflow:visible}
  .stage{position:static;transform:none!important;width:auto;height:auto;background:none}
  .s{display:flex!important;position:relative;inset:auto;page-break-after:always;break-after:page;animation:none!important}
  .hud{display:none}
  @page{size:1920px 1080px;margin:0}
}
</style>
</head>
